name: pytest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 04_SRC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The suite is pure-python: pytest + pandas. MetaTrader5 is imported
      # lazily by smc/data/mt5_connector.py, so CI needs no terminal and no
      # MT5 package. pyarrow is installed because the parquet loader resolves
      # its engine at call time.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas pyarrow

      - name: Run test suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q
