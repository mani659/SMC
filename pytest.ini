[pytest]
# One true command from the repo root:
#     python -m pytest -q
# The canonical suite command stays unchanged:
#     cd 04_SRC && PYTHONPATH=. python -m pytest -q
#
# Without this file a root-level run collects the corrupt recovery fragments
# under ARCHIVE/ (SyntaxError) and cannot import `smc` (the package lives in
# 04_SRC). Both were measurement-hygiene artefacts, not product failures.
testpaths = 04_SRC/tests
pythonpath = 04_SRC
# Overriding norecursedirs replaces pytest's defaults, so keep them and add
# the local non-test trees.
norecursedirs = ARCHIVE 02_KNOWLEDGE_BASE 07_DATA dist logs .* build CVS _darcs node_modules venv {arch} *.egg
